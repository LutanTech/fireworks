<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DOM Bit-Tree</title>
    <style>
        body {
            margin: 0;
            background: #020205;
            overflow: hidden;
            font-family: system-ui;
            perspective: 1000px;
            touch-action: none;
        }
        #world {
            position: absolute;
            inset: 0;
            transform-style: preserve-3d;
            will-change: transform;
            transition: left 0.5s ease-out, top 0.5s ease-out;
        }
        .bit {
            position: absolute;
            width: 12px;
            height: 12px;
            background-size: cover;
            will-change: transform;
            transition: opacity 0.3s;
            cursor: pointer;
        }
        .star {
            position: absolute;
            width: 30px;
            height: 30px;
            background: #ffea00;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            box-shadow: 0 0 30px #ffea00;
            will-change: transform;
            z-index: 10;
            cursor: pointer;
        }
        .firework-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            pointer-events: none;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #228b22;
            z-index: 100;
            text-align: center;
        }
        #hint {
            position: fixed;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.3);
            font-size: 11px;
            pointer-events: none;
        }
        video { display: none; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>
<body>
<div id="loading">Initializing Camera...</div>
<div id="hint">✋ OPEN: TREE | ✊ FIST: DISINTEGRATE | SCROLL: ZOOM | CLICK BIT: FOCUS</div>
<video id="video" autoplay playsinline></video>
<div id="world"></div>

<script>
    (function() {
        const world = document.getElementById('world');
        const video = document.getElementById('video');
        const loading = document.getElementById('loading');

        let w = window.innerWidth, h = window.innerHeight;
        let bits = [];
        let state = "tree";
        let scale = 1, targetScale = 1, scrollAcc = 0;
        
        let focusX = 0;
        let focusY = 0;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playPop() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(100 + Math.random() * 300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueToTime(10, audioCtx.currentTime + 0.3);
            g.gain.setValueAtTime(0.05, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            osc.connect(g).connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function createFirework(x, y) {
            playPop();
            const hue = Math.random() * 360;
            for (let i = 0; i < 15; i++) {
                const p = document.createElement('div');
                p.className = 'firework-particle';
                p.style.backgroundColor = `hsl(${hue}, 100%, 60%)`;
                world.appendChild(p);
                
                const angle = Math.random() * Math.PI * 2;
                const dist = 50 + Math.random() * 100;
                const tx = x + Math.cos(angle) * dist;
                const ty = y + Math.sin(angle) * dist;

                p.style.left = x + 'px';
                p.style.top = y + 'px';
                
                p.animate([
                    { transform: 'translate(0,0) scale(1)', opacity: 1 },
                    { transform: `translate(${tx - x}px, ${ty - y}px) scale(0)`, opacity: 0 }
                ], { duration: 800 + Math.random() * 400, easing: 'ease-out' }).onfinish = () => p.remove();
            }
        }

        class Bit {
            constructor(tx, ty, type) {
                this.tx = tx; this.ty = ty;
                this.x = Math.random() * w; this.y = Math.random() * h;
                this.el = document.createElement('div');
                this.el.className = type === 'star' ? 'star' : 'bit';
                if (type !== 'star') {
                    this.el.style.backgroundColor = type === 'leaf' ? '#228b22' : '#ff4d6d';
                    if (Math.random() > 0.8) this.el.style.backgroundColor = '#fff';
                }
                
                this.el.onclick = (e) => {
                    e.stopPropagation();
                    targetScale = 3.5;
                    focusX = (w / 2) - this.tx;
                    focusY = (h / 2) - this.ty;
                };

                world.appendChild(this.el);
            }

            update() {
                let dx, dy;
                if (state === "disintegrated") {
                    const noiseX = Math.sin(Date.now() * 0.0015 + this.tx) * 220;
                    const noiseY = Math.cos(Date.now() * 0.0015 + this.ty) * 220;
                    dx = (this.tx + noiseX) - this.x;
                    dy = (this.ty + noiseY) - this.y;
                    this.x += dx * 0.04;
                    this.y += dy * 0.04;
                } else {
                    dx = this.tx - this.x;
                    dy = this.ty - this.y;
                    this.x += dx * 0.1;
                    this.y += dy * 0.1;
                }
                this.el.style.transform = `translate3d(${this.x}px, ${this.y}px, 0)`;
            }
        }

        function build() {
            world.innerHTML = '';
            bits = [];
            const cx = w / 2 - 6, cy = h / 2 - 100;
            bits.push(new Bit(cx - 8, cy - 85, 'star'));
            for (let r = 0; r < 15; r++) {
                const rowW = r * 15;
                for (let i = 0; i < r; i++) {
                    const x = cx - (rowW / 2) + (i * 15);
                    const y = cy + (r * 18);
                    bits.push(new Bit(x, y, Math.random() > 0.9 ? 'ornament' : 'leaf'));
                }
            }
            for (let t = 0; t < 12; t++) {
                bits.push(new Bit(cx - 10 + (t % 3) * 12, cy + 270 + Math.floor(t / 3) * 12, 'trunk'));
            }
        }

        const hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${f}` });
        hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.5 });
        hands.onResults(res => {
            loading.style.display = 'none';
            if (res.multiHandLandmarks?.length) {
                const lm = res.multiHandLandmarks[0];
                const isFist = [8, 12, 16, 20].every(i => lm[i].y > lm[i - 2].y);
                state = isFist ? "disintegrated" : "tree";
            } else {
                state = "tree";
            }
        });

        async function startCamera() {
            try {
                const camera = new Camera(video, { 
                    onFrame: async () => await hands.send({ image: video }), 
                    width: 640, 
                    height: 480 
                });
                await camera.start();
            } catch (err) {
                loading.innerHTML = "Camera access denied.<br>Please allow camera permissions and refresh.";
                loading.style.color = "#ff4d6d";
            }
        }

        startCamera();

        window.addEventListener('wheel', e => {
            targetScale -= e.deltaY * 0.001;
            targetScale = Math.min(Math.max(0.3, targetScale), 5);
            scrollAcc += Math.abs(e.deltaY);
            if (scrollAcc > 150) {
                createFirework(Math.random() * w, Math.random() * h * 0.5);
                scrollAcc = 0;
            }
        });

        document.body.onclick = () => {
            focusX = 0;
            focusY = 0;
            targetScale = 1;
        };

        function loop() {
            scale += (targetScale - scale) * 0.1;
            world.style.transformOrigin = `${w/2}px ${h/2}px`;
            world.style.transform = `translate3d(${focusX * scale}px, ${focusY * scale}px, 0) scale(${scale})`;
            bits.forEach(b => b.update());
            requestAnimationFrame(loop);
        }

        window.addEventListener('resize', () => { 
            w = window.innerWidth; 
            h = window.innerHeight; 
            build(); 
        });
        
        build();
        loop();
    })();
</script>
</body>
</html>
