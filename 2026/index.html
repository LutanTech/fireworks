<body>
<h2 id="year">2026</h2>

<canvas id="canvas"></canvas>

<div id="welcomeIcon">

<div id="welcomeCard">
    <h1>Welcome to 2026 🚀</h1>

    <div id="quoteBox">Click the button. Motivation loading…</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    let width, height;
    let fireworks = [];
    let particles = [];

    const colors = [
        '#FF6AD5',
        '#C77DFF',
        '#7BF1A8',
        '#FFCFD2',
        '#8ECAE6',
        '#FDFFB6',
        '#FF9770'
    ];

    const quotes = [
        "You are early. Keep building.",
        "Nobody sees the grind until the results show.",
        "Ship it scared. Improve it later.",
        "Consistency beats motivation every time.",
        "Your future self is watching. Do not disappoint.",
        "Ideas are cheap. Execution is rare.",
        "Build something that scares you a little.",
        "You are one project away from changing everything.",
        "Keep going. You are closer than you think.",
        "Sleep is optional. Purpose is not."
    ];

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resize);
    resize();

    function playWhooshSound() {
        if (audioCtx.state === 'suspended') return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(900, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 1);
    }

    function playPopSound() {
        if (audioCtx.state === 'suspended') return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400 + Math.random() * 200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
    }

    class Firework {
        constructor(x, targetY, color) {
            this.x = x;
            this.y = height;
            this.targetY = targetY;
            this.color = color;
            this.velocity = (targetY - height) / 60;
            this.dead = false;
            playWhooshSound();
        }
        update() {
            this.y += this.velocity;
            if (this.y <= this.targetY) {
                this.dead = true;
                this.explode();
            }
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
        }
        explode() {
            playPopSound();
            for (let i = 0; i < 50; i++) {
                particles.push(new Particle(this.x, this.y, this.color));
            }
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.color = color;
            this.angle = Math.random() * Math.PI * 2;
            this.speed = Math.random() * 5 + 1;
            this.friction = 0.96;
            this.gravity = 0.12;
            this.alpha = 1;
            this.decay = Math.random() * 0.015 + 0.015;
        }
        update() {
            this.speed *= this.friction;
            this.x += Math.cos(this.angle) * this.speed;
            this.y += Math.sin(this.angle) * this.speed + this.gravity;
            this.alpha -= this.decay;
        }
        draw() {
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
            ctx.restore();
        }
    }

    function launchFirework(x, y) {
        const color = colors[Math.floor(Math.random() * colors.length)];
        const targetX = x ?? Math.random() * width;
        const targetY = y ?? Math.random() * height * 0.5;
        fireworks.push(new Firework(targetX, targetY, color));
    }

    function animate() {
        ctx.fillStyle = 'rgba(8, 8, 16, 0.2)';
        ctx.fillRect(0, 0, width, height);
        if (Math.random() < 0.03) launchFirework();
        fireworks.forEach((fw, i) => {
            fw.update();
            fw.draw();
            if (fw.dead) fireworks.splice(i, 1);
        });
        particles.forEach((p, i) => {
            p.update();
            p.draw();
            if (p.alpha <= 0) particles.splice(i, 1);
        });
        requestAnimationFrame(animate);
    }

    document.getElementById('welcomeIcon').onclick = () => {
        document.getElementById('welcomeCard').style.display = 'flex';
    };

    document.getElementById('welcomeCard').onclick = () => {
        document.getElementById('welcomeCard').style.display = 'none';
    };

    document.getElementById('quoteBtn').onclick = (e) => {
        e.stopPropagation();
        const q = quotes[Math.floor(Math.random() * quotes.length)];
        document.getElementById('quoteBox').textContent = q;
    };

    window.addEventListener('mousedown', e => {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        launchFirework(e.clientX, e.clientY);
    });

    animate();
</script>
